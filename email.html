<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send Me an Email</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <div class="nav-logo">Logo</div>
    <ul class="nav-links">
      <li><a href="index.html#hero">Home</a></li>
      <li><a href="index.html#experience">Experience</a></li>
      <li><a href="index.html#about">About</a></li>
      <li><a href="index.html#projects">Projects</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
    <div class="nav-right">
      <a href="index.html" class="nav-cta">Back to Portfolio</a>
    </div>
  </nav>

  <main style="padding: 120px 24px 80px;">
    <section class="wrap" style="max-width: 720px; margin: 0 auto;">
      <div style="background: rgba(19, 19, 19, 0.96); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; padding: 42px; box-shadow: 0 24px 80px rgba(0,0,0,0.35);">
        <h1 style="font-size: clamp(30px, 4vw, 44px); margin-bottom: 18px;">Send Me an Email</h1>
        <p style="font-family: var(--font); font-size: 15px; color: var(--muted); line-height: 1.8; margin-bottom: 32px;">Use the form below to message me directly. I typically reply within 24 hours.</p>
        <form class="cform">
          <div class="frow">
            <div class="field">
              <label>Name</label>
              <input type="text" placeholder="Your name" />
            </div>
            <div class="field">
              <label>Email</label>
              <input type="email" placeholder="you@example.com" />
            </div>
          </div>
          <div class="field">
            <label>Subject</label>
            <input type="text" placeholder="What is this about?" />
          </div>
          <div class="field">
            <label>Message</label>
            <textarea placeholder="Write your message here..."></textarea>
          </div>
          <button type="submit" class="fsub">Send Message</button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
